<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Grand Theft Walk Dev Control</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --border: #2e2e2e;
    --text: #e0e0e0;
    --dim: #666;
    --ok: #4caf7d;
    --err: #e05555;
    --accent: #e8d84b;
    --font: 'IBM Plex Mono', monospace;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
  }

  body {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    padding: 0;
  }

  /* ── header ── */
  header {
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-shrink: 0;
  }

  header .title {
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
  }

  header .subtitle {
    font-size: 0.65rem;
    color: var(--dim);
    letter-spacing: 0.05em;
  }

  /* ── log ── */
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    -webkit-overflow-scrolling: touch;
  }

  .log-cmd {
    color: var(--dim);
    font-size: 0.8rem;
    padding-top: 8px;
  }

  .log-cmd::before {
    content: '› ';
    color: var(--accent);
  }

  .log-result {
    font-size: 0.8rem;
    padding-left: 12px;
  }

  .log-result.ok  { color: var(--ok); }
  .log-result.err { color: var(--err); }

  .log-empty {
    color: var(--dim);
    font-size: 0.75rem;
    margin: auto;
    text-align: center;
    line-height: 2;
  }

  /* ── input area ── */
  footer {
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    flex-shrink: 0;
    background: var(--surface);
  }

  .input-label {
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 8px;
  }

  .input-row {
    display: flex;
    gap: 8px;
    align-items: stretch;
  }

  #cmd {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font);
    font-size: 1rem;
    padding: 10px 12px;
    outline: none;
    border-radius: 3px;
    -webkit-appearance: none;
    appearance: none;
  }

  #cmd:focus {
    border-color: var(--accent);
  }

  #submit {
    background: var(--accent);
    color: #0f0f0f;
    border: none;
    font-family: var(--font);
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 10px 16px;
    border-radius: 3px;
    cursor: pointer;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
  }

  #submit:active {
    opacity: 0.75;
  }
</style>
</head>
<body>

<header>
  <span class="title">Grand Theft Walk Control</span>
  <span class="subtitle">dev mode</span>
</header>

<details style="padding: 8px 16px; border-bottom: 1px solid var(--border)">
  <summary>Explore progress</summary>
  <div id="explore-status" role="status" style="padding: 8px 0">Waiting for navigation data</div>
  <canvas id="explore-map" width="620" height="210" style="width: 100%; max-height: 210px"
          aria-label="Local exploration map: covered ground, recent route, destination, and failed connections"></canvas>
  <small>Blue: covered ground · White: recent route · Green: destination · Red: failed connections</small>
</details>

<div id="log">
  <div class="log-empty" id="empty-msg">no commands sent yet</div>
</div>

<footer>
  <div class="input-label">Command</div>
  <div class="input-row">
    <input id="cmd" type="text" autocomplete="off" autocorrect="off"
           autocapitalize="off" spellcheck="false" placeholder="e.g. walk" autofocus />
    <button id="submit">Send</button>
  </div>
</footer>

<script>
const input  = document.getElementById('cmd');
const log    = document.getElementById('log');
const submit = document.getElementById('submit');
const empty  = document.getElementById('empty-msg');

let chatCursor = 0;
let polling = false;
let navigationPolling = false;

async function pollNavigation() {
  const canvas = document.getElementById('explore-map');
  if (!canvas.closest('details').open || navigationPolling) return;
  navigationPolling = true;
  const label = document.getElementById('explore-status');
  try {
    const response = await fetch('/navigation');
    const data = await response.json();
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (!response.ok) { label.textContent = data.error || 'Navigation unavailable'; return; }
    const info = data.navigation.exploration;
    if (!info || !data.position) { label.textContent = 'Waiting for Explore coverage'; return; }
    label.textContent = `${data.mode} · ${info.visited_cells} areas · ${info.visited_nodes}/${info.total_nodes} path nodes · ${info.blocked_connections} failed connections`;
    const p = data.position;
    const point = q => [canvas.width / 2 + (q[0] - p.x) * 1.5,
                        canvas.height / 2 - (q[1] - p.y) * 1.5];
    const line = (a, b, color) => {
      ctx.strokeStyle = color; ctx.beginPath(); ctx.moveTo(...point(a)); ctx.lineTo(...point(b)); ctx.stroke();
    };
    ctx.fillStyle = '#244f78';
    (info.covered_cells || []).forEach(c => {
      if (Math.abs((c[2] + .5) * 6 - p.z) > 6) return;
      const [x, y] = point([c[0] * 12, (c[1] + 1) * 12]);
      ctx.fillRect(x, y, 18, 18);
    });
    const route = info.recent_route || [];
    route.slice(1).forEach((q, i) => line(route[i], q, '#eeeeee'));
    (info.failed_edges || []).forEach(([a,b]) => line(a,b,'#f06a6a'));
    (info.failed_steps || []).forEach(s => line([(s[0]+.5)*12,(s[1]+.5)*12], [(s[3]+.5)*12,(s[4]+.5)*12], '#f06a6a'));
    if (info.goal_position) {
      const [x, y] = point(info.goal_position);
      ctx.fillStyle = '#7ee787'; ctx.fillRect(x - 4, y - 4, 8, 8);
    }
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(canvas.width/2, canvas.height/2, 4, 0, Math.PI*2); ctx.fill();
  } catch (error) { label.textContent = 'Navigation unavailable'; }
  finally { navigationPolling = false; }
}

function appendResult(text, error = false) {
  if (empty && empty.isConnected) empty.remove();
  const el = document.createElement('div');
  el.className = 'log-result ' + (error ? 'err' : 'ok');
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}

async function pollChat() {
  if (polling) return;
  polling = true;
  try {
    const res = await fetch('/chat?after=' + chatCursor);
    const data = await res.json();
    data.messages.forEach(message => appendResult(message));
    chatCursor = data.cursor;
  } catch(e) {
  } finally {
    polling = false;
  }
}

async function sendCommand() {
  const raw = input.value.trim();
  input.value = '';
  if (!raw) return;

  if (empty && empty.isConnected) empty.remove();

  const cmdEl = document.createElement('div');
  cmdEl.className = 'log-cmd';
  cmdEl.textContent = raw;
  log.appendChild(cmdEl);

  try {
    const res = await fetch('/cmd/' + encodeURIComponent(raw));
    const data = await res.json();
    if (!data.ok) appendResult(data.error || 'ERROR', true);
  } catch(e) {
    appendResult('network error', true);
  }

  await pollChat();
  input.focus();
}

submit.addEventListener('click', sendCommand);
input.addEventListener('keydown', e => { if (e.key === 'Enter') sendCommand(); });
setInterval(pollChat, 500);
setInterval(pollNavigation, 1000);
document.querySelector('details').addEventListener('toggle', pollNavigation);
pollChat();
</script>
</body>
</html>
